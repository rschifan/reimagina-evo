[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reimagina"
version = "0.1.0"
description = "Reimagina urban planning scenario modelling platform — prototype"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "psycopg2-binary>=2.9",
    "geopandas>=0.14",
    "shapely>=2.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    "pandas>=2.0",
    # Read-side API stack. FastAPI is sync-compatible with the psycopg2
    # storage layer through the default thread-pool dispatch.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # httpx powers FastAPI's TestClient for in-process API tests.
    "httpx>=0.27",
    # mapbox_vector_tile decodes MVT bytes in the r017 tile-function tests.
    "mapbox-vector-tile>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/py/reimagina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["packages/py/reimagina"]
