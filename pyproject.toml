[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reimagina"
version = "0.1.0"
description = "Reimagina urban planning scenario modelling platform — prototype"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "psycopg2-binary>=2.9",
    "geopandas>=0.14",
    "shapely>=2.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/py/reimagina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["packages/py/reimagina"]
