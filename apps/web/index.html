<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reimagina · read-side</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Same TopBar component the catalog and ops pages render, mounted here
         from `src/main.ts`. Separate entries are not routes, so "shared nav"
         means a shared component each entry mounts for itself. -->
    <div id="topbar"></div>

    <main class="app">
      <!-- Collapses the sidebar at any width, and is the only way to open it
           below the breakpoint, where it becomes an overlay drawer. Lives
           outside the sidebar so it stays reachable once the sidebar is
           gone. `aria-expanded` is what a screen reader reads; the glyph is
           swapped in main.ts to match. -->
      <button
        type="button"
        id="sidebar-toggle"
        class="sidebar-toggle"
        aria-expanded="true"
        aria-controls="sidebar"
        title="Hide panel (\\)"
      >
        <span aria-hidden="true">⟨</span>
        <span class="sr-only">Hide panel</span>
      </button>
      <!-- Click-catcher behind the drawer on small screens. A drawer with no
           way out but the toggle is a trap on a phone, where the toggle is
           the thing the drawer is covering. -->
      <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
      <aside class="sidebar" id="sidebar">

        <section data-section="aoi">
          <h2>Pilot</h2>
          <label>
            <span>Active AOI</span>
            <select id="aoi-select"></select>
          </label>
          <div id="aoi-info" class="aoi-info" hidden></div>
        </section>

        <!-- Scenario authoring: picker, one proposal form, recompute.
             Rendered from `src/scenario.ts`; empty until then, like
             `#layer-toggles`. Sits under the pilot because a scenario
             belongs to one AOI and governs which indicators the picker
             below can offer. -->
        <section data-section="scenario">
          <h2>Scenario</h2>
          <div id="scenario-panel" class="scenario-panel"></div>
        </section>

        <section data-section="layers">
          <h2>Spatial layers</h2>
          <div id="layer-toggles" class="layer-toggles"></div>
        </section>

        <section data-section="indicators">
          <h2>Indicator overlay</h2>
          <label>
            <span>Indicator</span>
            <select id="indicator-select">
              <option value="">(none)</option>
            </select>
          </label>
          <div id="grain-toggle" class="grain-toggle" hidden></div>
          <!-- Values / Difference, for the active scenario only. Rendered from
               `src/choropleth.ts`; hidden on the baseline city. -->
          <div id="mode-toggle" class="grain-toggle" hidden></div>
          <div id="legend" class="legend" hidden></div>
          <div id="downloads" class="downloads" hidden>
            <button type="button" data-format="csv">Download CSV</button>
            <button type="button" data-format="geojson">Download GeoJSON</button>
            <button type="button" data-format="parquet">Download GeoParquet</button>
          </div>
        </section>

        <section data-section="status">
          <div id="status" class="status"></div>
        </section>
      </aside>

      <section class="map-panel">
        <div id="map"></div>
        <!-- Loading indicator: visible whenever the map is fetching tiles
             or the page is performing an async data refresh. CSS hides
             it by default; main.ts toggles ``data-loading`` on the host
             element to flip visibility. -->
        <div id="map-loading" class="map-loading" aria-hidden="true">
          <div class="map-loading__spinner" role="progressbar" aria-label="Loading"></div>
        </div>
        <!-- Selection toolbar: three draw modes + a clear button.
             main.ts wires data-shape attributes to controller.startDrawing(). -->
        <div class="selection-toolbar" role="toolbar" aria-label="Selection tools">
          <button type="button" class="selection-toolbar__btn" data-shape="circle" title="Draw circle selection" aria-label="Draw circle">●</button>
          <button type="button" class="selection-toolbar__btn" data-shape="rectangle" title="Draw rectangle selection" aria-label="Draw rectangle">▭</button>
          <button type="button" class="selection-toolbar__btn" data-shape="polygon" title="Draw polygon selection" aria-label="Draw polygon">⬠</button>
          <button type="button" class="selection-toolbar__btn selection-toolbar__btn--clear" data-action="clear" title="Clear selection" aria-label="Clear selection">×</button>
        </div>
        <!-- Per-selection metrics panel. Hidden until the user draws
             something; main.ts populates from selection-metrics.ts. -->
        <aside id="selection-panel" class="selection-panel" hidden aria-live="polite">
          <h3 class="selection-panel__title">Selection</h3>
          <!-- Headline total: sum of all selected geometries across
               every counted layer. Useful for at-a-glance "did I
               actually catch anything" sanity checks. -->
          <p class="selection-panel__total" data-testid="selection-total">
            <span class="selection-panel__total-value">0</span>
            <span class="selection-panel__total-label">geometries selected</span>
          </p>
          <dl class="selection-panel__metrics"></dl>
        </aside>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
