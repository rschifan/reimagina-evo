name: Bug report
description: Something isn't working as expected.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide enough detail for us to reproduce.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps, CLI commands, or code to reproduce.
      placeholder: |
        1. Run `python -m apps.cli.app cdmx status`
        2. Open …
        3. See error …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or the release tag.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - api
        - worker
        - web
        - cli
        - storage / db
        - tiles / raster
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
