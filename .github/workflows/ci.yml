name: CI

on:
  push:
    # The long-lived ops-plane tracks are gated too. They are never merged into
    # main — the comparison is the deliverable — so a PR-only trigger would
    # leave both of them permanently untested.
    #
    # `feat/**` matches only a first segment of exactly `feat`, so the
    # `feature/**` and `fix/**` branches the repo also uses got no push run at
    # all and were tested for the first time when a PR opened. Both are listed
    # now; a branch whose name matches none of these is still covered by the
    # pull_request trigger, not by nothing.
    branches: [main, "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday 06:00 UTC — catches dep rot on main.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The interpreter every uv command uses. `requires-python` is `>=3.12`, so
  # without this uv is free to pick — or download — any version satisfying it,
  # and the Python the suite ran on would be a resolution detail rather than a
  # decision. The floor and this now agree: the declared range used to be
  # wider than the gated one (floor 3.11, nothing testing it), and raising the
  # floor to 3.12 both closed that gap and let the resolver reach pyproj 3.8.
  UV_PYTHON: "3.12"
  # Makes every `uv run` assert the lockfile too, not just the explicit
  # `uv sync` step — `uv run` performs an implicit sync, and this keeps it from
  # quietly resolving anything the install step refused.
  UV_LOCKED: "1"

jobs:
  lint-py:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `--locked`, not `--frozen`. Both install from uv.lock, but `--frozen`
      # merely declines to update it — a lock left stale by a pyproject edit is
      # used silently. `--locked` asserts the lock would not change, so that
      # edit fails here instead of shipping. Both linters are declared in the
      # dev extra, so the versions that gate CI are the versions `make lint`
      # runs.
      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy packages/py/reimagina apps scripts

  test-py-unit:
    name: Unit + Contract tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # ⚠ Best-effort, and that is the whole point. This is a *fallback* for
      # the case where fiona/rasterio have no wheel for the interpreter — its
      # original name said so. They do have one: both ship cp312 manylinux
      # x86_64 wheels carrying their own GDAL (28 bundled shared objects), so
      # on UV_PYTHON 3.12 nothing here is ever loaded.
      #
      # Left fatal, it took the whole suite down. On 2026-11-11 the runners
      # could not resolve `security.ubuntu.com`; apt retried for 1h40m and
      # then failed, and because this is step 4 of 6, `pytest` never ran in
      # either job that has it — two of the four. A mirror outage three
      # networks away is not a verdict on this repository's code.
      #
      # So it may fail, and the job carries on to the wheels that were going
      # to be used anyway. If a future dependency genuinely has no wheel, the
      # install step here will have run and succeeded whenever apt is healthy;
      # if apt is also down that day, `uv sync` fails loudly on the build
      # instead, which names the real problem.
      - name: System dependencies (optional GDAL fallback; wheels bundle their own)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev

      # ⚠ `--locked`, not a bare install. This was `pip install -e '.[dev]'`,
      # which re-resolved every dependency on every run and ignored the
      # committed uv.lock entirely — so a green build said nothing about the
      # versions that would actually deploy, and an upstream release could turn
      # CI red on a PR that changed no code. `dbos` makes that concrete: the
      # constraint is `>=2.28,<3` because, as the comment beside it says,
      # breaking changes ship inside its minor releases.
      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: pytest (unit + contract)
        run: uv run pytest tests/unit tests/contract

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      # ⚠ 22, not 20. jsdom 31 supports Node ^22.22.2 || ^24.15.0 || >=26,
      # and the undici 8 it pulls in needs >=22.19: undici binds
      # `zlib.createZstdDecompress` at import, which Node 20 does not have, so
      # under 20 every vitest file that loads jsdom dies in collection with
      # "Cannot read properties of undefined (reading 'bind')". The jsdom
      # upgrade arrived on a branch that could not run CI while it conflicted
      # with main, so the first run is where it surfaced. Node 20 has been
      # end-of-life since April 2026 in any case.
      - uses: actions/setup-node@v7
        with:
          # The floor above is also declared in apps/web/package.json, where
          # engine-strict makes npm refuse rather than warn — so a wrong Node
          # fails at install with one line instead of at worker spawn with five.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck + build
        run: npm run build

      - name: vitest
        run: npm test

  test-py-integration:
    name: Integration tests (Postgres + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis/postgis plus pgRouting — same Postgres major and PostGIS minor,
        # so an addition rather than an upgrade. Migration r037 needs
        # pgr_drivingDistance. Keep in step with infra/docker/docker-compose.yml.
        image: pgrouting/pgrouting:16-3.4-3.6.1
        env:
          POSTGRES_USER: reimagina
          POSTGRES_PASSWORD: reimagina
          # Named *_test so conftest's destructive migrated_db fixture
          # (downgrade-to-base on teardown) accepts it; postgis enables
          # its extension on this DB at init.
          POSTGRES_DB: reimagina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reimagina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A real transaction-mode pooler, for the one test whose claim is that
      # bootstrap tells pgbouncer from Postgres; no fake can show that. Same
      # image as infra/docker/docker-compose.yml. Its database is created by
      # the "Pooled scratch database" step; pgbouncer connects lazily.
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: reimagina_pooled_test
          DB_USER: reimagina
          DB_PASSWORD: reimagina
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
        ports:
          - 6432:5432
    env:
      # conftest's migrated_db fixture reads TEST_DATABASE_URL and runs the
      # migrations itself; the integration tests build storage backends from
      # this DSN. No standalone alembic step needed.
      TEST_DATABASE_URL: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
      # The app pool (deps.api_dsn) reads REIMAGINA_APP_DSN; test_api_routes
      # exercises a live app against it. Point it at the same migrated DB.
      REIMAGINA_APP_DSN: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
      # And the ops plane's own DSN, which is not optional: dbos_dsn() raises
      # rather than let DBOS fall back to SQLite and write checkpoints
      # somewhere unrecoverable. One integration test reaches the real
      # orchestrator through the job routes, so without this line that test
      # failed, the step failed, and `pytest (conformance)` below — a later
      # step in this same job — was reported skipped rather than run. Direct
      # and never pooled: LISTEN/NOTIFY backs the progress streams and cannot
      # cross PgBouncer in transaction mode.
      #
      # Same DSN as the pooled one: there is no pgbouncer in CI, so the pooled
      # and direct DSNs coincide here. They must NOT be collapsed in
      # deployments, where this one has to bypass the pooler for LISTEN/NOTIFY.
      DATABASE_URL_DIRECT: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
      # This job attaches a Postgres service precisely so the DB-backed suites
      # run, so a run in which they skip has not passed — it has reported
      # green having executed nothing. pytest exits 0 on an all-skipped
      # session, and "322 skipped, 6 passed" reads as success in every summary
      # anyone looks at. With this set, conftest fails instead of skipping
      # when the database is unreachable.
      #
      # Not hypothetical: this workflow was green for months while
      # `pytest (conformance)` skipped its whole suite for a missing
      # DATABASE_URL_DIRECT. The variable above fixed that instance; this one
      # makes the class of it visible.
      REIMAGINA_REQUIRE_DB: "1"
      # Read by test_ensure_system_database_refuses_a_transaction_mode_pooler,
      # which skips without it. A database of its own: the test asserts the
      # dbos schema is absent, which the shared test database does not keep.
      REIMAGINA_POOLED_TEST_DSN: "postgresql://reimagina:reimagina@localhost:6432/reimagina_pooled_test"
      #
      # ⚠ One blind spot this layout keeps, recorded rather than papered over.
      # All three DSNs above name the same database, and each suite below runs
      # as its own process. A developer's `.env` has them distinct (as
      # `.env.example` prescribes) and `pytest tests/` runs them in one
      # process, so state cached across suites against a *stale DSN* cannot
      # fail here and does fail for a reader. It did:
      # `dbos_orchestrator._client()` cached one client on first use, and
      # three conformance tests failed under `pytest tests/` while passing
      # alone. The cover for that class is
      # `tests/unit/test_dbos_client_cache.py`, which asserts the caching
      # directly instead of hoping a pipeline shape exposes it.
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Best-effort for the same reason as the unit job's copy above — see the
      # comment there. `postgresql-client` rides along and is not used either:
      # the suite talks to Postgres through psycopg2, and `psql` appears in
      # this repository only in a README line a human might type. `gdal-bin`
      # is the exception that is used: it ships `ogr2ogr` (GDAL 3.8, with the
      # PMTiles driver, on ubuntu-24.04), without which the PMTiles export
      # end-to-end test skips. On an apt-outage day it still skips — visible
      # in the skip count — rather than taking the job down.
      - name: System dependencies (optional; wheels bundle their own GDAL)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev gdal-bin postgresql-client

      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: Pooled scratch database
        run: >-
          uv run python -c "import os, psycopg2;
          c = psycopg2.connect(os.environ['TEST_DATABASE_URL']); c.autocommit = True;
          c.cursor().execute('CREATE DATABASE reimagina_pooled_test')"

      - name: pytest (integration)
        run: uv run pytest tests/integration

      # The Orchestrator port contract, asserted against every implementation
      # this branch ships. Runs here rather than in the unit job because it
      # needs Postgres, and separately from the integration step so an
      # ops-plane branch's conformance output is its own diffable artifact.
      - name: pytest (conformance)
        run: uv run pytest tests/conformance
