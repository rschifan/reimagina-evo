name: CI

on:
  push:
    # The long-lived ops-plane tracks are gated too. They are never merged into
    # main — the comparison is the deliverable — so a PR-only trigger would
    # leave both of them permanently untested.
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday 06:00 UTC — catches dep rot on main.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-py:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test-py-unit:
    name: Unit + Contract tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies (GDAL for fiona/rasterio wheels fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev

      - name: Install package (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: pytest (unit + contract)
        run: pytest tests/unit tests/contract

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck + build
        run: npm run build

      - name: vitest
        run: npm test

  test-py-integration:
    name: Integration tests (Postgres + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis/postgis plus pgRouting — same Postgres major and PostGIS minor,
        # so an addition rather than an upgrade. Migration r037 needs
        # pgr_drivingDistance. Keep in step with infra/docker/docker-compose.yml.
        image: pgrouting/pgrouting:16-3.4-3.6.1
        env:
          POSTGRES_USER: reimagina
          POSTGRES_PASSWORD: reimagina
          # Named *_test so conftest's destructive migrated_db fixture
          # (downgrade-to-base on teardown) accepts it; postgis enables
          # its extension on this DB at init.
          POSTGRES_DB: reimagina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reimagina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest's migrated_db fixture reads TEST_DATABASE_URL and runs the
      # migrations itself; the integration tests build storage backends from
      # this DSN. No standalone alembic step needed.
      TEST_DATABASE_URL: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
      # The app pool (deps.api_dsn) reads REIMAGINA_APP_DSN; test_api_routes
      # exercises a live app against it. Point it at the same migrated DB.
      REIMAGINA_APP_DSN: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev postgresql-client

      - name: Install package (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: pytest (integration)
        run: pytest tests/integration

      # The Orchestrator port contract, asserted against every implementation
      # this branch ships. Runs here rather than in the unit job because it
      # needs Postgres, and separately from the integration step so an
      # ops-plane branch's conformance output is its own diffable artifact.
      - name: pytest (conformance)
        run: pytest tests/conformance
