name: CI

on:
  push:
    # The long-lived ops-plane tracks are gated too. They are never merged into
    # main — the comparison is the deliverable — so a PR-only trigger would
    # leave both of them permanently untested.
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday 06:00 UTC — catches dep rot on main.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The interpreter every uv command uses. `requires-python` is `>=3.11`, so
  # without this uv is free to pick — or download — any version satisfying it,
  # and the Python the suite ran on would be a resolution detail rather than a
  # decision. Note the floor is 3.11 while this is 3.12: nothing tests 3.11
  # today, so the declared range is wider than the gated one.
  UV_PYTHON: "3.12"
  # Makes every `uv run` assert the lockfile too, not just the explicit
  # `uv sync` step — `uv run` performs an implicit sync, and this keeps it from
  # quietly resolving anything the install step refused.
  UV_LOCKED: "1"

jobs:
  lint-py:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `--locked`, not `--frozen`. Both install from uv.lock, but `--frozen`
      # merely declines to update it — a lock left stale by a pyproject edit is
      # used silently. `--locked` asserts the lock would not change, so that
      # edit fails here instead of shipping. Both linters are declared in the
      # dev extra, so the versions that gate CI are the versions `make lint`
      # runs.
      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy packages/py/reimagina apps scripts

  test-py-unit:
    name: Unit + Contract tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: System dependencies (GDAL for fiona/rasterio wheels fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev

      # ⚠ `--locked`, not a bare install. This was `pip install -e '.[dev]'`,
      # which re-resolved every dependency on every run and ignored the
      # committed uv.lock entirely — so a green build said nothing about the
      # versions that would actually deploy, and an upstream release could turn
      # CI red on a PR that changed no code. `dbos` makes that concrete: the
      # constraint is `>=2.28,<3` because, as the comment beside it says,
      # breaking changes ship inside its minor releases.
      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: pytest (unit + contract)
        run: uv run pytest tests/unit tests/contract

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck + build
        run: npm run build

      - name: vitest
        run: npm test

  test-py-integration:
    name: Integration tests (Postgres + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis/postgis plus pgRouting — same Postgres major and PostGIS minor,
        # so an addition rather than an upgrade. Migration r037 needs
        # pgr_drivingDistance. Keep in step with infra/docker/docker-compose.yml.
        image: pgrouting/pgrouting:16-3.4-3.6.1
        env:
          POSTGRES_USER: reimagina
          POSTGRES_PASSWORD: reimagina
          # Named *_test so conftest's destructive migrated_db fixture
          # (downgrade-to-base on teardown) accepts it; postgis enables
          # its extension on this DB at init.
          POSTGRES_DB: reimagina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reimagina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest's migrated_db fixture reads TEST_DATABASE_URL and runs the
      # migrations itself; the integration tests build storage backends from
      # this DSN. No standalone alembic step needed.
      TEST_DATABASE_URL: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
      # The app pool (deps.api_dsn) reads REIMAGINA_APP_DSN; test_api_routes
      # exercises a live app against it. Point it at the same migrated DB.
      REIMAGINA_APP_DSN: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
      # ⚠ Required, not optional. `dbos_dsn()` raises rather than let DBOS fall
      # back to SQLite, so any test that reaches the real orchestrator — e.g.
      # test_api_routes' end-to-end 404 through the live app — fails without
      # this. Omitting it cost a red integration job and, because `pytest
      # (conformance)` is a later step in the same job, silently skipped the
      # port-contract suite on every run.
      #
      # Same DSN as above: there is no pgbouncer in CI, so the pooled and
      # direct DSNs coincide here. They must NOT be collapsed in deployments,
      # where this one has to bypass the pooler for LISTEN/NOTIFY.
      DATABASE_URL_DIRECT: "postgresql://reimagina:reimagina@localhost:5432/reimagina_test"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev postgresql-client

      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: pytest (integration)
        run: uv run pytest tests/integration

      # The Orchestrator port contract, asserted against every implementation
      # this branch ships. Runs here rather than in the unit job because it
      # needs Postgres, and separately from the integration step so an
      # ops-plane branch's conformance output is its own diffable artifact.
      - name: pytest (conformance)
        run: uv run pytest tests/conformance
