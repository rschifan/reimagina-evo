[alembic]
script_location = infra/db/migrations
prepend_sys_path = .
# path_separator replaces the legacy whitespace/comma/colon splitting for
# prepend_sys_path. Alembic 1.13 emits a DeprecationWarning without it.
path_separator = os
version_path_separator = os

# ⚠ Deliberately empty. `env.py` resolves the URL as
# `configured_url or DATABASE_URL or default` (migration_env.resolve_migration_url),
# so any value here wins over the environment — and a value naming a real
# database made `DATABASE_URL=... alembic upgrade|downgrade ...` silently target
# it instead. This line used to read `postgresql://localhost/reimagina_app`,
# under a comment claiming DATABASE_URL overrode it; it never did.
#
# Empty keeps the precedence ("explicit config wins") that every programmatic
# caller relies on — postgres_alembic_config, tests/conftest.py and
# tests/workloads/conftest.py all pass a DSN via set_main_option — while letting
# the bare CLI fall through to DATABASE_URL. Alembic itself never reads this
# key: env.py builds the engine with create_engine(_url()).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
