---
# Local development stack of the prototype.
#
# Services:
#   postgres   — PostgreSQL 16 + PostGIS 3.4 + pgRouting 3.6
#   pgbouncer  — Connection pooler (transaction mode) — apps connect here
#   martin     — Vector tile server — frontend connects here for MVT tiles
#
# Quick start:
#   cp .env.example .env                    # at repo root; fill in passwords
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
#   # Run migrations against postgres directly (not via pgbouncer):
#   DATABASE_URL=$DATABASE_URL_DIRECT alembic upgrade head
#
# Published ports bind 127.0.0.1 by default. A bare "H:C" binds every
# interface and slips past host firewalls, which would expose a superuser
# Postgres and unauthenticated tiles to the whole network. To reach the stack
# from another machine, set REIMAGINA_BIND_ADDRESS (e.g. 0.0.0.0) in .env and
# change POSTGRES_PASSWORD first.

name: reimagina

services:

  # ── PostgreSQL + PostGIS + pgRouting ────────────────────────────────────────
  # pgrouting/pgrouting is postgis/postgis with pgRouting added: same Postgres
  # major, same PostGIS minor, so this is an addition and not an upgrade. The
  # network-accessibility indicators need pgr_drivingDistance (migration r037),
  # and postgis/postgis does not ship it. Keep this tag in step with the CI
  # service image in .github/workflows/ci.yml.
  postgres:
    image: pgrouting/pgrouting:16-3.4-3.6.1
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-reimagina}
      POSTGRES_USER:     ${POSTGRES_USER:-reimagina_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed for direct admin access (DBeaver, QGIS, migration runner).
      # Application code must use pgbouncer:5432, not this port.
      - "${REIMAGINA_BIND_ADDRESS:-127.0.0.1}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reimagina_app} -d ${POSTGRES_DB:-reimagina}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── PgBouncer (transaction mode) ────────────────────────────────────────────
  # Apps connect to pgbouncer:5432. PgBouncer multiplexes onto a small pool
  # of real Postgres connections — keeps Postgres backend count low under load.
  #
  # Transaction mode is compatible with all app code that uses SET LOCAL
  # (not SET) for session variables and does not use LISTEN/NOTIFY.
  # For LISTEN/NOTIFY (SSE job status), connect directly via DATABASE_URL_DIRECT.
  #
  # ⚠ Not `bitnami/pgbouncer`, which this used to be. That tag no longer
  # resolves — Broadcom retired Bitnami's free Docker Hub catalogue — and the
  # service was broken before that, twice over: Bitnami's pooler listens on
  # 6432, not the 5432 mapped and health-checked below, so it never became
  # healthy; and it exposes the pool under the alias `postgres`, so the
  # `REIMAGINA_APP_DSN` in `.env.example` (…:5432/reimagina) was answered
  # "no such database" even on the right port. `bitnamilegacy/pgbouncer`
  # still serves the old tags, as a frozen archive with no security rebuilds.
  #
  # This Alpine community image fixes all three: it listens on 5432, exposes
  # the pool under `DB_NAME`, and ships `pg_isready`, which the healthcheck
  # runs *inside* the container. Its environment variable names are its own —
  # the keys below changed from Bitnami's `POSTGRESQL_*`/`PGBOUNCER_*`, the
  # values did not.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB:-reimagina}
      DB_USER:     ${POSTGRES_USER:-reimagina_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Client logins use SCRAM, not this image's default `md5`: md5 password
      # auth is deprecated upstream, and Postgres 16 already stores SCRAM.
      AUTH_TYPE:   scram-sha-256
      POOL_MODE:            transaction
      MAX_CLIENT_CONN:      200
      DEFAULT_POOL_SIZE:    20
      SERVER_RESET_QUERY:   "DISCARD ALL"
      # Silence noisy connect/disconnect logs in dev
      LOG_CONNECTIONS:      0
      LOG_DISCONNECTIONS:   0
    ports:
      - "${REIMAGINA_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Martin vector tile server ───────────────────────────────────────────────
  # Serves MVT tiles from serving_geo.get_tile().
  # Connects directly to Postgres (bypasses PgBouncer) — martin manages its own
  # connection pool and the tile function is stateless/STABLE.
  #
  # Tile URL: http://localhost:3000/get_tile/{z}/{x}/{y}
  # With filter: http://localhost:3000/get_tile/{z}/{x}/{y}?type_slug=building
  # Catalog: http://localhost:3000/catalog
  # TileJSON: http://localhost:3000/get_tile
  martin:
    image: ghcr.io/maplibre/martin:v0.14.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Martin connects directly to Postgres for low-latency tile generation.
      # ⚠ Over the compose network (`postgres:5432`), not `.env`'s
      # DATABASE_URL_DIRECT: that is `localhost:5433`, which inside this
      # container is Martin itself, so it crash-looped on "connection refused".
      DATABASE_URL: postgresql://${POSTGRES_USER:-reimagina_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-reimagina}
    volumes:
      - ./martin.yaml:/config.yaml:ro
    command: ["--config", "/config.yaml"]
    ports:
      - "${REIMAGINA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    healthcheck:
      # 127.0.0.1: `localhost` resolves to ::1 here and Martin listens on IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PMTiles static hosting (dev only) ──────────────────────────────────────
  # Serves exported PMTiles snapshot artifacts from the repo-local data folder.
  # This is intentionally simple: snapshots are built by the CLI and served as
  # static files. Martin remains responsible only for the live MVT path.
  pmtiles_static:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../../data/tiles/pmtiles:/usr/share/nginx/html:ro
    ports:
      - "${REIMAGINA_BIND_ADDRESS:-127.0.0.1}:3001:80"

volumes:
  postgres_data:
