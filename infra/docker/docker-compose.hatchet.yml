# Hatchet ops-plane — self-hosted, MIT, no RabbitMQ.
#
# `hatchet-lite` bundles the engine, API and dashboard in one container. The
# production shape is the four-service split (engine / api / dashboard /
# migration); this is the same software with the same configuration, which is
# what makes it a legitimate development target rather than a different system.
#
# Postgres is NOT in here: it runs on the host, the same instance holding the
# domain data. That is deliberate — it keeps the comparison honest by not
# charging this track for a database the other track also needs.
services:
  hatchet:
    # Pin the engine by **digest**, not by tag. SDK compatibility and migrations
    # must move through an explicit tested upgrade, and a tag cannot express
    # that — it is a mutable pointer, so "pinned to v0.86.24" is a claim about a
    # name rather than about bytes.
    #
    # ⚠ Not hypothetical. This file read `hatchet-lite:v0.86.24` while the
    # container actually running locally had been started from
    # `hatchet-lite:latest` — a *different manifest*, confirmed by comparing the
    # two. Every spike and qualification result on this branch was therefore
    # measured against an image the compose did not name, and nothing anywhere
    # would have said so.
    #
    # This digest is the image the results in `tests/qualification/README.md`
    # were measured against: `latest` as pulled 2026-07-27. Re-qualify before
    # moving it.
    image: ${HATCHET_IMAGE:-ghcr.io/hatchet-dev/hatchet/hatchet-lite@sha256:b1ab44a0e155ae0fd1cba4d0bd6e92fabd1f476e0669cbeba8fe0e8a2c97f216}
    ports:
      - "8888:8888"   # dashboard + REST API
      - "7077:7077"   # gRPC, what the SDK connects to
    environment:
      DATABASE_URL: "postgresql://${HATCHET_PG_USER:-rschifan}@host.docker.internal:5432/hatchet?sslmode=disable"
      DATABASE_POSTGRES_HOST: host.docker.internal
      DATABASE_POSTGRES_PORT: "5432"
      DATABASE_POSTGRES_USERNAME: "${HATCHET_PG_USER:-rschifan}"
      DATABASE_POSTGRES_DB_NAME: hatchet
      DATABASE_POSTGRES_SSL_MODE: disable

      # ⚠ Measured, not guessed: left at its default this engine opened **94 of
      # the host's 100 connections** and held them at idle, so the next thing to
      # connect — the API, a worker, or a test suite — got "sorry, too many
      # clients already". The workload suite skipped its whole run that way,
      # reporting a missing database rather than a full one.
      #
      # This is the price of the sharing decision above, not an argument against
      # it: an engine co-located on the domain database has to be told it is a
      # guest. The library track has no equivalent knob because it has no
      # standing service to bound.
      #
      # ⚠ It bounds one pool, not the engine's total. Measured at idle:
      # 94 connections before, 47 after — the engine keeps several pools and
      # only one of them honours this. Enough to unblock the suite, not enough
      # to call the footprint small; the honest number for the comparison is
      # "~47 idle connections on a shared Postgres", not "20".
      DATABASE_MAX_CONNS: "20"
      DATABASE_MIN_CONNS: "2"

      # No broker to operate. `postgres` is a first-class MIT implementation,
      # and it is what Hatchet's own release compose uses — so this track costs
      # zero extra infrastructure beyond the engine itself.
      SERVER_MSGQUEUE_KIND: postgres

      # ⚠ Development values. Three of the settings in this block are unsafe
      # outside localhost and are grouped so they are changed together:
      #
      #   SERVER_AUTH_COOKIE_INSECURE  — session cookies without the Secure flag
      #   SERVER_GRPC_INSECURE         — the SDK connection is plaintext
      #   SERVER_AUTH_SET_EMAIL_VERIFIED — anyone who signs up is verified
      #
      # ⚠ And the seeded dashboard login (admin@example.com / Admin123!!) is a
      # hardcoded default in the engine's own source, not something chosen here.
      # Before this is reachable from anywhere but localhost: change that
      # password, terminate TLS in front of both ports, set
      # SERVER_GRPC_INSECURE=f with certificates, and set
      # HATCHET_CLIENT_TLS_STRATEGY on every client to match.
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_DEFAULT_ENGINE_VERSION: V1

      # Hourly outbound CVE poll to security.hatchet.run, ON by default. The
      # response is only logged. Off: we did not ask for it, and it is required
      # for an air-gapped deployment.
      SERVER_SECURITY_CHECK_ENABLED: "false"

      # ⚠ Not set, deliberately: SERVER_ENFORCE_LIMITS defaults false, and
      # setting it true inherits stingy built-ins (3 workers, 2000 task runs per
      # 24h).

      # ⚠ Run retention, set explicitly rather than left at its 720h default —
      # because it is now **pinned to a second value elsewhere**. `runs.replay()`
      # re-executes from the original input, which on this track is a `plan_id`
      # handle into `jobs_runtime.run_plan`, so a plan that expires before the
      # run it belongs to turns a replayable run into one that fails every unit.
      # scripts/reclaim_run_plans.sql must use a horizon *longer* than this.
      # Change one, change the other; 720h here means 45 days there.
      SERVER_LIMITS_DEFAULT_TENANT_RETENTION_PERIOD: "${HATCHET_RUN_RETENTION:-720h}"

      # ⚠ Both default **false**, confirmed against this engine's own
      # /api/v1/meta ("observabilityEnabled": false, "prometheusServerEnabled":
      # false). Metrics on a service track are the thing you are paying the
      # service for; leaving them off spends the cost and declines the benefit.
      # The library track has no equivalent to turn on.
      SERVER_OBSERVABILITY_ENABLED: "t"
      SERVER_PROMETHEUS_ENABLED: "t"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1gb   # the 64 MB container default is not enough for the engine
    volumes:
      - hatchet_config:/config
volumes:
  hatchet_config:
