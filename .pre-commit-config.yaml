# Ruff matches pyproject.toml / uv.lock; CI runs it through uv.
# Hooks also run file hygiene and Prettier, not the full CI suite.
# Setup: uv tool install pre-commit && pre-commit install
# Run: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Limit to web sources / configs — the rest of the repo is
        # Python and is handled by ruff-format above.
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|css|html|md)$
