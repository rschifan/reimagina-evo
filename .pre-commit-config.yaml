# Local + pre-push parity with CI.
#
# Ruff version is pinned to match `.github/workflows/ci.yml` so the
# hook reports the same diagnostics CI does — bumping one without the
# other surfaces "passes locally, fails in CI" reports that waste
# everyone's time.
#
# Install once per clone: `pre-commit install` (also documented in
# CONTRIBUTING.md). Run on demand: `pre-commit run --all-files`.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Limit to web sources / configs — the rest of the repo is
        # Python and is handled by ruff-format above.
        files: ^(apps/web|packages/ts)/.*\.(ts|tsx|js|jsx|json|css|html|md)$
